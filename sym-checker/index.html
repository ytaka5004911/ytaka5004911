<body>

<header>
  <div class="inner">
    <h1><span class="mark"></span>からだの相談チャット</h1>

<div class="disclaimer">

    これは医療診断ではなく、症状の整理と受診の目安をお伝えするためのものです。<b>必ず医師の診察に代わるものではありません。</b>
    <span class="emergency-line">⚠ 意識がない・呼吸が苦しい・激しい胸の痛みなど命に関わる症状があれば、今すぐ119番へ連絡するか救急外来を受診してください。</span>

</div>

<main>
  <div id="chat-wrap">
    <div id="log"></div>

    <div id="chips"></div>

    <div id="input-bar">
      <textarea id="text-input" rows="1" placeholder="例）3日前から頭が痛くて、少し熱っぽいです"></textarea>

    </div>
    <div id="reset-row">
      <button id="reset-btn">はじめからやり直す</button>
    </div>
    <a target="_self" href="https://ytaka5004911.github.io/ytaka5004911/index.html">ホームページに戻る</a>
  </div>
</main>

<footer>
  症状の言葉を単語ごとに読み取って会話します。<button class="about-btn" id="about-toggle">語彙の仕組みについて</button>
  <div id="about-panel"></div>
</footer>

<script>
/* =========================================================
   1. 語彙データの読み込み
   語彙は vocab.json にまとめてあります。ブラウザで直接
   index.html を開いた場合（file://）は fetch がブロックされる
   ことがあるため、その場合は下の <script id="vocab-fallback">
   に埋め込まれた同じ内容を使います。
   ========================================================= */

let BODY_GROUPS = [];
let SYMPTOM_GROUPS = [];
let INTENSITY_WORDS = [];
let FREQUENCY_WORDS = [];
let TIME_WORDS = [];
let URGENT_INTENSITY_WORDS = [];
let RED_FLAGS = [];
let SELF_HARM_WORDS = [];
let FINISH_WORDS = [];

const TIME_REGEX = /([0-9０-９]+)\s*(分|時間|日|週間|週|ヶ月|か月|カ月|ヵ月|月|年)(前|くらい前|ほど前|ぐらい前)?/g;

let bodyWordCount = 0;
let symptomWordCount = 0;
let modifierWordCount = 0;
let timeWordCount = 0;
let combinationCount = 0;

function formatNumber(n){ return n.toLocaleString("ja-JP"); }

function applyVocab(data){
  BODY_GROUPS = data.bodyGroups;
  SYMPTOM_GROUPS = data.symptomGroups;
  INTENSITY_WORDS = data.intensityWords;
  FREQUENCY_WORDS = data.frequencyWords;
  TIME_WORDS = data.timeWords;
  URGENT_INTENSITY_WORDS = data.urgentIntensityWords;
  RED_FLAGS = data.redFlags;
  SELF_HARM_WORDS = data.selfHarmWords;
  FINISH_WORDS = data.finishWords;

  bodyWordCount = BODY_GROUPS.reduce((n,g)=>n+g.items.length,0);
  symptomWordCount = SYMPTOM_GROUPS.reduce((n,g)=>n+g.items.length,0);
  modifierWordCount = INTENSITY_WORDS.length + FREQUENCY_WORDS.length;
  timeWordCount = TIME_WORDS.length;
  combinationCount = bodyWordCount * symptomWordCount * modifierWordCount * timeWordCount;
}

async function loadVocab(){
  try{
    const res = await fetch("vocab.json", { cache:"no-store" });
    if(!res.ok) throw new Error("vocab.json not reachable");
    return await res.json();
  }catch(e){
    const el = document.getElementById("vocab-fallback");
    return JSON.parse(el.textContent);
  }
}

/* =========================================================
   2. 単語単位でのテキスト解析
   ========================================================= */

function findMatches(text, groups, key){
  // 長い語から先に照合し、重複しないように部分一致を拾う
  const found = [];
  groups.forEach(group=>{
    group.items.slice().sort((a,b)=>b.length-a.length).forEach(word=>{
      if(text.includes(word)){
        found.push({ word, group: group[key], department: group.department, careTips: group.careTips || null });
      }
    });
  });
  return found;
}

function findFlat(text, words){
  return words.filter(w=>text.includes(w));
}

function findTimeExpressions(text){
  const found = findFlat(text, TIME_WORDS);
  const regexMatches = [...text.matchAll(TIME_REGEX)].map(m=>m[0]);
  return found.concat(regexMatches);
}

function containsAny(text, words){
  return words.some(w=>text.includes(w));
}

function isFinishText(text){
  const t = text.trim();
  return FINISH_WORDS.some(w=>t===w || t.startsWith(w));
}

function analyze(text){
  if(containsAny(text, SELF_HARM_WORDS)){
    return { type:"selfharm" };
  }
  if(containsAny(text, RED_FLAGS)){
    return { type:"emergency", matched: RED_FLAGS.filter(w=>text.includes(w)) };
  }
  return {
    type:"normal",
    bodyParts: findMatches(text, BODY_GROUPS, "system"),
    symptoms: findMatches(text, SYMPTOM_GROUPS, "category"),
    intensity: findFlat(text, INTENSITY_WORDS),
    frequency: findFlat(text, FREQUENCY_WORDS),
    times: findTimeExpressions(text),
    finish: isFinishText(text),
  };
}

/* =========================================================
   3. 会話の状態管理
   ========================================================= */

const session = {
  records: [],       // {body, symptom, department}
  times: new Set(),
  intensity: new Set(),
  frequency: new Set(),
  askedTime: false,
  askedIntensity: false,
  turnCount: 0,
  emergencyShown: false,
};

function resetSession(){
  session.records = [];
  session.times = new Set();
  session.intensity = new Set();
  session.frequency = new Set();
  session.askedTime = false;
  session.askedIntensity = false;
  session.turnCount = 0;
  session.emergencyShown = false;
}

const GENERIC_DEPARTMENT_PLACEHOLDER = "症状のある部位に応じた診療科";

function resolveDepartment(bp, sy){
  if(sy && sy.department && sy.department !== GENERIC_DEPARTMENT_PLACEHOLDER) return sy.department;
  if(bp && bp.department) return bp.department;
  if(sy) return sy.department;
  return null;
}

function mergeParsed(parsed){
  parsed.times.forEach(t=>session.times.add(t));
  parsed.intensity.forEach(t=>session.intensity.add(t));
  parsed.frequency.forEach(t=>session.frequency.add(t));

  if(parsed.bodyParts.length && parsed.symptoms.length){
    parsed.bodyParts.forEach(bp=>{
      parsed.symptoms.forEach(sy=>{
        const exists = session.records.some(r=>r.body===bp.word && r.symptom===sy.word);
        if(!exists){
          session.records.push({ body:bp.word, bodySystem:bp.group, symptom:sy.word, category:sy.group, department:resolveDepartment(bp, sy), careTips:sy.careTips });
        }
      });
    });
  } else if(parsed.bodyParts.length){
    parsed.bodyParts.forEach(bp=>{
      const exists = session.records.some(r=>r.body===bp.word && !r.symptom);
      if(!exists) session.records.push({ body:bp.word, bodySystem:bp.group, symptom:null, category:null, department:bp.department, careTips:null });
    });
  } else if(parsed.symptoms.length){
    parsed.symptoms.forEach(sy=>{
      const exists = session.records.some(r=>r.symptom===sy.word && !r.body);
      if(!exists) session.records.push({ body:null, symptom:sy.word, category:sy.group, department: sy.department === GENERIC_DEPARTMENT_PLACEHOLDER ? "内科（部位がはっきりすれば専門科の目安も出せます）" : sy.department, careTips:sy.careTips });
    });
  }
}

function assessUrgency(){
  const strong = [...session.intensity].some(w=>URGENT_INTENSITY_WORDS.includes(w));
  const veryRecent = [...session.times].some(t=>["今日から","今朝から","今から","たった今","急に","突然"].includes(t));
  if(strong){
    return "程度が強いとのことなので、我慢せずになるべく早め（できれば本日中）の受診をおすすめします。";
  }
  if(veryRecent && session.records.length){
    return "急に始まった症状のようです。しばらく様子を見ても構いませんが、悪化する場合や新しい症状が加わる場合はすぐ受診してください。";
  }
  return "数日様子を見ても改善しない場合や、少しずつ悪化する場合は受診を検討してください。";
}

function buildAckLine(parsed){
  const parts = [];
  parsed.bodyParts.forEach(bp=>parts.push("「"+bp.word+"」"));
  parsed.symptoms.forEach(sy=>parts.push("「"+sy.word+"」"));
  if(!parts.length) return null;

  let line = parts.join("・") + " について了解しました。";

  const extras = [];
  parsed.frequency.forEach(f=>extras.push("「"+f+"」症状が出る"));
  parsed.intensity.forEach(i=>extras.push("「"+i+"」程度"));
  parsed.times.forEach(t=>extras.push("「"+t+"」"));
  if(extras.length){
    line += "\n" + extras.join("、") + "とのことですね。";
  }
  return line;
}

function summaryText(){
  if(!session.records.length){
    return "記録されている症状はまだありません。";
  }
  const lines = session.records.map(r=>{
    let line = "・";
    if(r.body) line += r.body;
    if(r.symptom) line += (r.body ? "の" : "") + r.symptom;
    return line;
  });
  const times = [...session.times];
  const intensity = [...session.intensity, ...session.frequency];
  const departments = [...new Set(session.records.map(r=>r.department).filter(Boolean))];

  let out = "ここまでの内容を整理しますね。\n\n" + lines.join("\n");
  if(times.length) out += "\n\n【時期】" + times.join("、");
  if(intensity.length) out += "\n【程度・頻度】" + intensity.join("、");

  out += "\n\n【受診の目安】\n" + assessUrgency();

  if(departments.length){
    out += "\n\n【目安となる診療科】\n" + departments.map(d=>"・"+d).join("\n");
  }

  // カテゴリごとの具体的な対応（セルフケア）をまとめて重複なく表示
  const seenCategories = new Set();
  const tipBlocks = [];
  session.records.forEach(r=>{
    if(r.category && r.careTips && !seenCategories.has(r.category)){
      seenCategories.add(r.category);
      tipBlocks.push("■ " + r.category + "への対応\n" + r.careTips.map(t=>"・"+t).join("\n"));
    }
  });
  if(tipBlocks.length){
    out += "\n\n【今できる対応の目安】\n" + tipBlocks.join("\n\n");
  }

  out += "\n\n※ここでの対応はあくまで一般的なセルフケアの目安です。市販薬を使う場合は必ず用法・用量を守り、"
       + "持病がある方・妊娠中の方・小さなお子さんや高齢の方は自己判断せず医師や薬剤師に相談してください。"
       + "症状が続く場合や強くなる場合は、早めに医療機関を受診してください。";
  return out;
}

/* =========================================================
   4. 応答生成
   ========================================================= */

function emergencyReply(matched){
  session.emergencyShown = true;
  return "⚠ 今おっしゃった内容には、緊急性が高い可能性のある症状（" + matched.join("、") + "）が含まれています。\n\n"
    + "すぐに119番へ連絡するか、救急外来を受診してください。一人で判断せず、周りの人にも助けを求めてください。\n\n"
    + "落ち着いてから、他に伝えたいことがあれば続けて入力してください。";
}

function selfHarmReply(){
  return "つらい気持ちを話してくれてありがとうございます。今のお気持ちは、一人で抱え込まなくて大丈夫です。\n\n"
    + "もしよろしければ、下記の相談窓口にも連絡してみてください。\n"
    + "・よりそいホットライン：0120-279-338（24時間・無料）\n"
    + "・いのちの電話：0570-064-556\n"
    + "・チャット相談「生きづらびっと」（SNS相談）\n\n"
    + "体の症状について話したいことがあれば、続けて教えてください。無理のない範囲で大丈夫です。";
}

function normalReply(parsed, text){
  session.turnCount++;

  if(parsed.finish && session.records.length){
    return { text: summaryText(), tone:"care", done:true };
  }

  const ack = buildAckLine(parsed);
  const hasAnyInfo = parsed.bodyParts.length || parsed.symptoms.length || parsed.times.length || parsed.intensity.length || parsed.frequency.length;

  if(!hasAnyInfo){
    if(session.turnCount === 1 && !session.records.length){
      return { text: "うまく読み取れませんでした。「いつから」「どこが」「どんなふうに」を含めて、もう少し具体的に教えてください。\n例）3日前から頭が痛くて、少し熱っぽいです", tone:"bot" };
    }
    return { text: "もう少し詳しく教えてもらえますか？（例：場所、痛み方、いつからか など）", tone:"bot" };
  }

  let reply = "";
  if(ack) reply += ack + "\n\n";

  if(!session.times.size && !session.askedTime){
    session.askedTime = true;
    reply += "その症状はいつ頃からありますか？（例：3日前から、今朝から、1週間くらい前から）";
  } else if(!session.intensity.size && !session.frequency.size && !session.askedIntensity){
    session.askedIntensity = true;
    reply += "症状の程度や現れ方も教えてください。（例：かなり強い、時々、動くとひどくなる など）";
  } else {
    reply += "他に気になる症状はありますか？なければ「ない」と入力してください。";
  }
  return { text: reply, tone:"bot" };
}

/* =========================================================
   5. UI 制御
   ========================================================= */

const log = document.getElementById("log");
const input = document.getElementById("text-input");
const sendBtn = document.getElementById("send-btn");
const resetBtn = document.getElementById("reset-btn");
const chipsWrap = document.getElementById("chips");
const aboutToggle = document.getElementById("about-toggle");
const aboutPanel = document.getElementById("about-panel");

function addMessage(role, text, tone){
  const wrap = document.createElement("div");
  wrap.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble" + (tone ? " " + tone : "");
  bubble.textContent = text;
  wrap.appendChild(bubble);
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

function handleUserText(text){
  if(!text.trim()) return;
  addMessage("user", text);
  input.value = "";
  autoresize();

  const parsed = analyze(text);

  if(parsed.type === "emergency"){
    addMessage("bot", emergencyReply(parsed.matched), "emergency");
    return;
  }
  if(parsed.type === "selfharm"){
    addMessage("bot", selfHarmReply(), "care");
    return;
  }

  mergeParsed(parsed);
  const result = normalReply(parsed, text);
  addMessage("bot", result.text, result.tone === "care" ? "care" : undefined);
}

function autoresize(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 110) + "px";
}

const CHIP_EXAMPLES = [
  "3日前から頭が痛い",
  "今朝から喉が痛くて熱っぽい",
  "1週間前からお腹がゆるい",
  "昨日から膝が腫れて痛い",
  "最近ずっとだるくて眠れない",
];

function showGreeting(){
  addMessage("bot",
    "こんにちは。今のからだの調子について、話しかけるように教えてください。\n"
    + "「いつから」「どこが」「どんなふうに」を含めてもらえると、より詳しく整理できます。\n"
    + "例）3日前から頭が痛くて、少し熱っぽいです"
  );
}

async function init(){
  sendBtn.disabled = true;
  input.disabled = true;
  input.placeholder = "語彙データを読み込み中です…";

  const data = await loadVocab();
  applyVocab(data);

  sendBtn.disabled = false;
  input.disabled = false;
  input.placeholder = "例）3日前から頭が痛くて、少し熱っぽいです";

  sendBtn.addEventListener("click", ()=>handleUserText(input.value));
  input.addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && !e.shiftKey){
      e.preventDefault();
      handleUserText(input.value);
    }
  });
  input.addEventListener("input", autoresize);

  resetBtn.addEventListener("click", ()=>{
    resetSession();
    log.innerHTML = "";
    showGreeting();
  });

  CHIP_EXAMPLES.forEach(ex=>{
    const b = document.createElement("button");
    b.textContent = ex;
    b.addEventListener("click", ()=>{ input.value = ex; handleUserText(ex); });
    chipsWrap.appendChild(b);
  });

  aboutToggle.addEventListener("click", ()=>{
    const isOpen = aboutPanel.style.display === "block";
    aboutPanel.style.display = isOpen ? "none" : "block";
    aboutPanel.innerHTML =
      "このチャットは、あらかじめ用意した「体の部位（" + formatNumber(bodyWordCount) + "語）」"
      + "「症状の表現（" + formatNumber(symptomWordCount) + "語）」"
      + "「程度・頻度の表現（" + formatNumber(modifierWordCount) + "語）」"
      + "「時期の表現（" + formatNumber(timeWordCount) + "語＋数字表現）」を、"
      + "vocab.json というファイルにまとめて持ち、入力文の中から単語ごとに探して意味を理解しています。"
      + "これらは自由に組み合わせて使えるため、"
      + formatNumber(bodyWordCount) + "×" + formatNumber(symptomWordCount) + "×"
      + formatNumber(modifierWordCount) + "×" + formatNumber(timeWordCount)
      + " で 約" + formatNumber(combinationCount) + " 通り以上の言い回しに対応できます。"
      + "特定の病気を診断するものではなく、一般的な整理を行うためのしくみです。";
  });

  showGreeting();
}

init();
</script>
