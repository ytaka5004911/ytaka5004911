<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,initial-scale=1">

<title>○×ゲーム VS COM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=BIZ+UDGothic&display=swap');
body {
  font-family: "BIZ UDGothic", sans-serif;
  font-weight: 400;
  font-style: normal;
}
</style>

<style>

body{
    margin:0;
    
    background:#f5f5f5;

    display:flex;
    flex-direction:column;
    align-items:center;
}

h2{
    margin:20px 0 10px;
}

#status{
    margin:10px;
    font-size:20px;
}

#board{
    display:grid;

    grid-template-columns:
        repeat(3,100px);

    gap:5px;
}

.cell{
    width:100px;
    height:100px;

    background:white;

    border:2px solid #444;

    display:flex;

    justify-content:center;
    align-items:center;

    font-size:60px;

    cursor:pointer;

    user-select:none;
}

.cell:hover{
    background:#eee;
}

button{
    margin:20px;

    padding:10px 25px;

    font-size:18px;

    cursor:pointer;
}

</style>

</head>


<body>


<a href="./index.html">
ホームページ
</a>


<h2>
○×ゲーム VS COM
</h2>


<div id="status">
あなたの番（○）
</div>


<div id="board"></div>


<button onclick="resetGame()">
リセット
</button>



<script>


/* =========================
   HTML要素
========================= */

const board=
    document.getElementById("board");

const status=
    document.getElementById("status");



/* =========================
   ゲームデータ
========================= */

let cells=[];

let gameOver=false;

let cpuThinking=false;



/* =========================
   勝利パターン
========================= */

const winLines=[

    [0,1,2],

    [3,4,5],

    [6,7,8],

    [0,3,6],

    [1,4,7],

    [2,5,8],

    [0,4,8],

    [2,4,6]

];



/* =========================
   盤面を表示
========================= */

function draw(){

    board.innerHTML="";


    cells.forEach((value,index)=>{

        const cell=
            document.createElement("div");


        cell.className="cell";


        cell.textContent=value;


        cell.onclick=()=>{

            playerMove(index);

        };


        board.appendChild(cell);

    });

}



/* =========================
   プレイヤーの手
========================= */

function playerMove(index){


    // ゲーム終了
    if(gameOver){
        return;
    }


    // COMが考えている
    if(cpuThinking){
        return;
    }


    // すでに置かれている
    if(cells[index]!=""){
        return;
    }


    // ○を置く
    cells[index]="○";


    draw();



    /* プレイヤー勝利 */

    if(checkWinner(cells,"○")){

        status.textContent=
            "あなたの勝ち！🎉";

        gameOver=true;

        return;

    }



    /* 引き分け */

    if(full(cells)){

        status.textContent=
            "引き分け";

        gameOver=true;

        return;

    }



    /* COMのターン */

    cpuThinking=true;

    status.textContent=
        "COM考え中...";


    setTimeout(cpuMove,500);

}



/* =========================
   COMの手
   一般人レベル
========================= */

function cpuMove(){


    let empty=[];


    /* 空いている場所を探す */

    for(let i=0;i<9;i++){

        if(cells[i]==""){

            empty.push(i);

        }

    }


    /* 空きマスがない */

    if(empty.length===0){

        cpuThinking=false;

        return;

    }


    let move=-1;



    /* =========================
       ① COMが勝てる場所
    ========================= */

    for(let i of empty){


        cells[i]="×";


        if(checkWinner(cells,"×")){

            move=i;

            cells[i]="";

            break;

        }


        cells[i]="";

    }



    /* =========================
       ② プレイヤーを阻止
    ========================= */

    if(move===-1){


        for(let i of empty){


            cells[i]="○";


            if(checkWinner(cells,"○")){

                move=i;

                cells[i]="";

                break;

            }


            cells[i]="";

        }

    }



    /* =========================
       ③ 中央を優先
    ========================= */

    if(
        move===-1 &&
        cells[4]==""
    ){

        move=4;

    }



    /* =========================
       ④ 角を優先
    ========================= */

    if(move===-1){


        const corners=[

            0,
            2,
            6,
            8

        ];


        const availableCorners=
            corners.filter(
                i=>cells[i]==""
            );


        if(
            availableCorners.length>0
        ){

            move=
                availableCorners[
                    Math.floor(
                        Math.random() *
                        availableCorners.length
                    )
                ];

        }

    }



    /* =========================
       ⑤ それ以外はランダム
    ========================= */

    if(move===-1){

        move=
            empty[
                Math.floor(
                    Math.random() *
                    empty.length
                )
            ];

    }



    /* =========================
       COMが×を置く
    ========================= */

    cells[move]="×";


    draw();



    /* COM勝利 */

    if(checkWinner(cells,"×")){

        status.textContent=
            "COMの勝ち";

        gameOver=true;

        cpuThinking=false;

        return;

    }



    /* 引き分け */

    if(full(cells)){

        status.textContent=
            "引き分け";

        gameOver=true;

        cpuThinking=false;

        return;

    }



    /* プレイヤーのターン */

    cpuThinking=false;

    status.textContent=
        "あなたの番（○）";

}



/* =========================
   勝利判定
========================= */

function checkWinner(
    boardState,
    mark
){

    return winLines.some(
        line=>
            line.every(
                index=>
                    boardState[index]===mark
            )
    );

}



/* =========================
   盤面がいっぱいか
========================= */

function full(boardState){

    return boardState.every(
        value=>value!=""
    );

}



/* =========================
   ゲームリセット
========================= */

function resetGame(){


    cells=[

        "",
        "",
        "",

        "",
        "",
        "",

        "",
        "",
        ""

    ];


    gameOver=false;

    cpuThinking=false;


    status.textContent=
        "あなたの番（○）";


    draw();

}



/* =========================
   ゲーム開始
========================= */

resetGame();


</script>


</body>

</html>
