<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>○×ゲーム VS COM</title>

<style>
body{
    margin:0;
    font-family:sans-serif;
    background:#f5f5f5;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h2{
    margin:20px 0 10px;
}

#status{
    margin:10px;
    font-size:20px;
}

#board{
    display:grid;
    grid-template-columns:repeat(3,100px);
    gap:5px;
}

.cell{
    width:100px;
    height:100px;
    background:white;
    border:2px solid #444;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:60px;
    cursor:pointer;
    user-select:none;
}

.cell:hover{
    background:#eee;
}

button{
    margin:20px;
    padding:10px 25px;
    font-size:18px;
}
</style>

</head>
<body>
<a href="./index.html">ホームページ</a>
<h2>○×ゲーム VS COM</h2>

<div id="status">あなたの番（○）</div>

<div id="board"></div>

<button onclick="resetGame()">リセット</button>

<script>

const board=document.getElementById("board");
const status=document.getElementById("status");

let cells;
let gameOver;

const winLines=[
[0,1,2],
[3,4,5],
[6,7,8],
[0,3,6],
[1,4,7],
[2,5,8],
[0,4,8],
[2,4,6]
];

function draw(){

board.innerHTML="";

cells.forEach((v,i)=>{

const d=document.createElement("div");
d.className="cell";
d.textContent=v;

d.onclick=()=>playerMove(i);

board.appendChild(d);

});

}

function playerMove(i){

if(gameOver)return;
if(cells[i]!="")return;

cells[i]="○";

draw();

if(checkWinner(cells,"○")){
status.textContent="あなたの勝ち！";
gameOver=true;
return;
}

if(full(cells)){
status.textContent="引き分け";
gameOver=true;
return;
}

status.textContent="COM考え中...";

setTimeout(cpuMove,300);

}

function cpuMove(){

let bestScore=-Infinity;
let bestMove=-1;

for(let i=0;i<9;i++){

if(cells[i]==""){

cells[i]="×";

let score=minimax(cells,false);

cells[i]="";

if(score>bestScore){

bestScore=score;
bestMove=i;

}

}

}

cells[bestMove]="×";

draw();

if(checkWinner(cells,"×")){
status.textContent="COMの勝ち";
gameOver=true;
return;
}

if(full(cells)){
status.textContent="引き分け";
gameOver=true;
return;
}

status.textContent="あなたの番（○）";

}

function minimax(boardState,isMax){

if(checkWinner(boardState,"×")) return 1;
if(checkWinner(boardState,"○")) return -1;
if(full(boardState)) return 0;

if(isMax){

let best=-Infinity;

for(let i=0;i<9;i++){

if(boardState[i]==""){

boardState[i]="×";

best=Math.max(best,minimax(boardState,false));

boardState[i]="";

}

}

return best;

}else{

let best=Infinity;

for(let i=0;i<9;i++){

if(boardState[i]==""){

boardState[i]="○";

best=Math.min(best,minimax(boardState,true));

boardState[i]="";

}

}

return best;

}

}

function checkWinner(boardState,mark){

return winLines.some(line=>
line.every(i=>boardState[i]==mark)
);

}

function full(boardState){

return boardState.every(v=>v!="");

}

function resetGame(){

cells=["","","","","","","","",""];
gameOver=false;
status.textContent="あなたの番（○）";
draw();

}

resetGame();

</script>

</body>
</html>
