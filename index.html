<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
<title>ホームページ</title>
<link rel="manifest" href="/ytaka5004911/manifest.json">
<meta name="theme-color" content="#2196f3">
<script>(function(){ navigator.serviceWorker.register('/ytaka5004911/sw.js').then(a=>console.log(a)) })();</script>
</head>
<body>
<form action="https://www.google.com/search" method="get" target="_blank">
  <input type="text" name="q" placeholder="キーワードを入力">
  <input type="hidden" name="ie" value="UTF-8">
  <button type="submit">Googleで検索</button>
</form>
 <form action="https://www.youtube.com/results" method="get"><input name="search_query" type="text"><button type="submit">Youtubeで検索</button></form><p><a href="https://weather.yahoo.co.jp/weather/">Yahoo天気・災害</a></p>
 <p><a href="https://www.yahoo.co.jp/">Yahoo! Japan</a></p>
<p><a href="https://www.google.com/">Google</a></p>
 <p><a href="https://www.youtube.com/">YouTube</a></p><p><a href="https://transit.yahoo.co.jp/diainfo/area/4">鉄道運行情報</a></p>
<h2>最近見たリンク</h2>
<ul id="history"></ul>
 <p id="time"></p>

<script>
function updateTime() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("ja-JP", {
  hour12: false
})
}

updateTime();
setInterval(updateTime, 1000);
</script><p id="usb"></p>
<p id="online"></p>

<script>
function update() {
  document.getElementById("usb").textContent =
    "USB: " + ("usb" in navigator ? "対応" : "非対応");

  document.getElementById("online").textContent =
    "オンライン: " + (navigator.onLine ? "はい" : "いいえ");
}

update();

window.addEventListener("online", update);
window.addEventListener("offline", update);
</script>
 <p id="connection"></p>

<script>
function updateConnection() {
  const c = navigator.connection;

  if (!c) {
    document.getElementById("connection").textContent =
      "Connection API: 非対応";
    return;
  }

  document.getElementById("connection").innerHTML =
    `回線: ${c.effectiveType}<br>` +
    `速度: ${c.downlink} Mbps<br>` +
    `遅延: ${c.rtt} ms<br>` +
    `データ節約: ${c.saveData ? "ON" : "OFF"}`;
}

updateConnection();

navigator.connection?.addEventListener("change", updateConnection);
</script>
 <h2>地震情報</h2>
<script>
 const t = () => {
  const d = new Date().getHours() >= 18 || new Date().getHours() < 6;
  document.documentElement.style.backgroundColor =
  document.body.style.backgroundColor = d ? "#121212" : "#fff";
  document.body.style.color = d ? "#fff" : "#000";
};
t();
setInterval(t, 60000);
 fetch("https://api.p2pquake.net/v1/human-readable").then(r=>r.json()).then(d=>d.forEach(e=>e.code==551&&document.body.append(Object.assign(document.createElement("p"),{textContent:`${e.earthquake.time} ${e.earthquake.hypocenter.name} 最大震度${{10:1,20:2,30:3,40:4,45:"5弱",50:"5強",55:"6弱",60:"6強",70:7}[e.earthquake.maxScale]} M${e.earthquake.hypocenter.magnitude}`}))));
const KEY = "history";
function showHistory() {
  const history = JSON.parse(localStorage.getItem(KEY) || "[]");
  const ul = document.getElementById("history");
  ul.innerHTML = "";
  history.forEach(item => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = item.href;
    a.textContent = item.text;
    a.target = "_blank";
    li.appendChild(a);
    ul.appendChild(li);
  });
}
document.querySelectorAll("a").forEach(a => {
  a.addEventListener("click", () => {
    let history = JSON.parse(localStorage.getItem(KEY) || "[]");
    history = history.filter(item => item.href !== a.href);
    history.unshift({
      href: a.href,
      text: a.textContent
    });
    history = history.slice(0, 10);
    localStorage.setItem(KEY, JSON.stringify(history));
  });
});
showHistory();
</script>
</body>
</html>
