<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ホームページ</title>
    <link rel="manifest" href="/ytaka5004911/manifest.json">
    <meta name="theme-color" content="#2196f3">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/ytaka5004911/favicon.ico">
    <style>main{display:block;}a{display:inline-block;padding:12px 0;}p{margin:12px 0;}</style>
    <script>if('serviceWorker' in navigator)window.addEventListener('load',function(){var r=navigator.serviceWorker.register('/ytaka5004911/sw.js');r.then(function(s){s.update()});r['catch'](function(e){if(window.console)console.error(e)});});</script>
  </head>
  <body>
    <main>
      <form id="searchForm" role="search" action="https://www.google.com/search" method="get" target="_blank">
        <label for="search">Googleで検索する</label>
        <input aria-label="Googleで検索する内容" enterkeyhint="search" inputmode="search" id="search" autocapitalize="off" autocomplete="off" placeholder="Googleで検索します..." required type="text" name="q">
        <input type="hidden" name="ie" value="UTF-8">
        <input type="hidden" name="oe" value="UTF-8">
        <input type="hidden" name="hl" value="ja">
        <button aria-label="検索する" type="submit">Googleで検索</button>
        <button aria-label="AI検索する" type="submit" name="udm" value="50">AI検索</button>
        <button aria-label="URLに転送する" id="url_btn" type="button" onclick="gourl()">URLに転送する</button>
        <button aria-label="サービス名で検索する" id="service_btn" type="button" onclick="go()">サービス名で検索する</button>
      </form>
      <nav aria-label="リンク">
        <ul>
          <li><a href="https://ytaka5004911.github.io/ytaka5004911/colorMix.html">色調合</a></li>
          <li><a href="https://ytaka5004911.github.io/MedChartLite/index.html">MedChartLite</a></li>
        </ul>
      </nav>
    </main>
    <script>(function(){var f=document.getElementById("searchForm");if(!f)return;f.onsubmit=function(){setTimeout(function(){f.reset();},0);};})();</script>
    <script>(function(){function gourl(){var v=document.getElementById('search').value.replace(/\s+/g,"");if(v){if(v.indexOf('://')===-1)v='https://'+v;if(v.indexOf('.')!==-1){document.getElementById("search").value="";location.href=v;}}}window.gourl=gourl;var sites=[];function noFile(){if(typeof console!=="undefined"&&typeof console.warn==="function"){console.warn("[Warning] Some features are disabled in this environment.");}var e=document.getElementById("service_btn");if(e){e.style.display="none";e.ariaHidden="true";e.hidden=true;}}function onData(x){sites=x.sites}if(typeof fetch==="function"){fetch("/ytaka5004911/sites.json").then(function(r){if(!r.ok){noFile();return;};return r.json()}).then(function(data){if(data){onData(data);}})['catch'](function(){noFile()});}else if(typeof fetch!=="function"&&typeof XMLHttpRequest==="undefined"){noFile()}else{var xhr=new XMLHttpRequest();xhr.open("GET","/ytaka5004911/sites.json",true);xhr.onreadystatechange=function(){if(xhr.readyState===4){if(xhr.status===200){onData(JSON.parse(xhr.responseText))}else{noFile()}}};xhr.send()}function go(){if(!Array.prototype.filter||!Array.prototype.some){noFile();return;}var q=document.getElementById("search").value.replace(/\s+/g,"").toLowerCase();var hit=sites.filter(function(s){return s.name.toLowerCase()===q||(s.aliases||[]).some(function(a){return a.toLowerCase()===q})})[0];if(hit){document.getElementById("search").value="";location.href=hit.url;}}window.go = go;})();</script>
  </body>
</html>
