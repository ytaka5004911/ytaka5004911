<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>ホームページ  |  検索と便利ツール</title>
    <meta name="description" content="Google検索やAI検索、URL・サービス名検索ができる便利なホームページ。オフラインでも利用できるほか、各種ツールやサービスにもすぐアクセスできます。">
    <link rel="manifest" href="/ytaka5004911/manifest.json">
    <meta name="theme-color" content="#2196f3">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/ytaka5004911/favicon.ico">
    <style>button:active{background-color:#1d4ed8;}main{display:block}a{display:inline-block;padding:12px 0}p{margin:12px 0}</style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const r = navigator.serviceWorker.register('/ytaka5004911/sw.js');
          r.then(s => s.update())
           .catch(e => { if (window.console) console.error(e); });
        });
      }
    </script>
  </head>
  <body>
    <h1>ホームページ|検索と便利ツール</h1>
    <main>
      <form rel="noreferrer noopener" id="searchForm" role="search" action="https://www.google.com/search" method="get" target="_blank">
        <label for="search">Googleで検索する</label>
        <input aria-label="Googleで検索する内容" enterkeyhint="search" autocorrect="false" spellcheck="false" inputmode="search" id="search" placeholder="Googleで検索します..." required type="text" name="q" writingsuggestions="false">
        <input type="hidden" name="ie" value="UTF-8">
        <input type="hidden" name="oe" value="UTF-8">
        <input type="hidden" name="hl" value="ja">
        <button aria-label="検索する" type="submit">Googleで検索</button>
        <button aria-label="AI検索する" type="submit" name="udm" value="50">AI検索</button>
        <button aria-label="URLに転送する" id="url_btn" type="button">URLに転送する</button>
      </form><h2>履歴</h2><div id="history"></div><button onclick="localStorage.removeItem('searchHistory');location.reload();">履歴をすべて削除</button>
      <nav aria-label="リンク">
        <ul>
          <li><a target="_self" href="https://ytaka5004911.github.io/ytaka5004911/sym-checker/index.html">からだの相談チャット</a></li>
          <li><a target="_self" href="https://ytaka5004911.github.io/ytaka5004911/colorMix.html">色調合</a></li>
          <li><a target="_self" href="https://ytaka5004911.github.io/MedChartLite/index.html">MedChartLite</a></li>
          <li><a target="_self" href="https://ytaka5004911.github.io/ytaka5004911/faq">よくある質問</a></li>
        </ul>
      </nav>
    </main><select id="themeSelect" onchange="localStorage.theme=this.value;setTheme(this.value)"><option value="light">ライトモード</option><option value="dark">ダークモード</option></select><script>var se=document.getElementById('themeSelect');var setTheme=function(t){document.body.style.backgroundColor=t==='dark'?'#1a1a1a':'#fff';document.body.style.color=t==='dark'?'#fff':'#000';};se.value=localStorage.theme||'light';setTheme(se.value)</script>
    <script>
    var S=document.getElementById('search');
document.getElementById('url_btn').addEventListener('click',function(e){
var v=S.value.replace(/^\s+|\s+$/g,'');if(e.preventDefault)e.preventDefault();else event.returnValue=false;
if(v){if(v.indexOf('://')==-1&&v.indexOf('.')!=-1)v='https://'+v;if(!v.indexOf('http')){S.value='';location.href=v;}}
});
    </script>
<script>const $=s=>document.querySelector(s),f=$('#searchForm'),s=$('#search'),d=$('#history'),K='searchHistory';let h;try{h=JSON.parse(localStorage[K])}catch{}Array.isArray(h)||(h=[]);const v=()=>{try{localStorage[K]=JSON.stringify(h)}catch{}},w=()=>d.replaceChildren(...h.map((t,i)=>{const r=document.createElement('div'),b=document.createElement('button');r.textContent=t.q+' ';r.onclick=()=>s.value+=t.q+' ';b.type='button';b.textContent='削除';b.onclick=e=>{e.stopPropagation();h.splice(i,1);v();w()};r.append(b);return r}));f.addEventListener('submit',e=>{const q=s.value.trim();q&&(h=[{q,type:e.submitter?.name=='udm'?'ai':'google'},...h.filter(x=>x.q!=q)].slice(0,30),v())});w()</script>
  </body>
</html>
