<body itemscope itemtype="https://schema.org/WebSite">
 <meta itemprop="name" content="ホームページ">
 <main>
  <form itemprop="potentialAction" itemscope itemtype="https://schema.org/SearchAction" role="search" action="https://www.google.com/search" method="get" target="_blank">

    <input itemprop="query-input" aria-label="Googleで検索する内容" enterkeyhint="search" inputmode="search" id="search" autocapitalize="off" spellcheck="false" autocomplete="off" autocorrect="off" placeholder="Googleで検索します..." required type="text" name="q" writingsuggestions="false" translate="no">

    <button aria-label="検索する" type="submit">Googleで検索</button>
    <button aria-label="AI検索する" type="submit" name="udm" value="50">AI検索</button>
    <button aria-label="URLに転送する" type="button" onclick="var v=document.getElementById('search').value.trim();if(v){if(v.indexOf('://')===-1)v='https://'+v;if(v.indexOf('.')!==-1)location.href=v;}">URLに転送する</button>

 <script>var sites=[];function onData(x){sites=x.sites}if(typeof fetch==="function"){fetch("/ytaka5004911/sites.json").then(function(r){return r.json()}).then(onData)}else{var xhr=new XMLHttpRequest();xhr.open("GET","/ytaka5004911/sites.json",true);xhr.onreadystatechange=function(){if(xhr.readyState===4&&xhr.status===200)onData(JSON.parse(xhr.responseText))};xhr.send()}function go(){var q=document.getElementById("search").value.toLowerCase();var hit=sites.filter(function(s){return s.name.toLowerCase()===q||(s.aliases||[]).some(function(a){return a.toLowerCase()===q})})[0];if(hit){location.href=hit.url}else{alert("このサービスは登録されていないようです。")}}</script>
