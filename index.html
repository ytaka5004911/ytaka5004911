<style>
.box {
  max-width: 500px;
  margin: auto;
  padding: 25px;
  background: white;
  border-radius: 20px;
  box-shadow: 0 4px 15px rgba(0,0,0,.1);

  font-size: 28px;
  font-weight: bold;

  font-size: 20px;

  font-size: 24px;
  font-weight: bold;
  margin: 20px 0;
}

  font-size: 22px;
  font-weight: bold;
  margin-top: 20px;
}
</style>

<div class="box">

  <div id="date" class="date"></div>

  <div id="month" class="item"></div>

  <div id="remaining" class="item"></div>

  <div id="lesson" class="lesson"></div>

  <div id="todayHoliday" class="item"></div>

  <div id="nextHoliday" class="holiday"></div>

  <div id="nextHolidayDate" class="item"></div>

</div>


<script>

const today = new Date();

const year = today.getFullYear();
const month = today.getMonth();
const date = today.getDate();
const weekday = today.getDay();

const weekNames = [
  "日曜日",
  "月曜日",
  "火曜日",
  "水曜日",
  "木曜日",
  "金曜日",
  "土曜日"
];

function formatDate(d) {

  const y = d.getFullYear();

  const m = String(
    d.getMonth() + 1
  ).padStart(2, "0");

  const day = String(
    d.getDate()
  ).padStart(2, "0");

  return `${y}-${m}-${day}`;
}

function nthMonday(year, month, n) {

  const d = new Date(
    year,
    month,
    1
  );

  let count = 0;

  while (true) {

    if (d.getDay() === 1) {

      count++;

      if (count === n) {
        return new Date(d);
      }
    }

    d.setDate(
      d.getDate() + 1
    );
  }
}

function vernalEquinox(year) {

  return Math.floor(
    20.8431 +
    0.242194 * (year - 1980) -
    Math.floor((year - 1980) / 4)
  );
}

function autumnalEquinox(year) {

  return Math.floor(
    23.2488 +
    0.242194 * (year - 1980) -
    Math.floor((year - 1980) / 4)
  );
}

function getHolidays(year) {

  const holidays = [];

  function add(month, day, name) {

    const d = new Date(
      year,
      month - 1,
      day
    );

    holidays.push({
      date: formatDate(d),
      name: name
    });
  }

  add(1, 1, "元日");

  const comingOfAge =
    nthMonday(year, 0, 2);

  holidays.push({
    date: formatDate(comingOfAge),
    name: "成人の日"
  });

  add(2, 11, "建国記念の日");

  add(2, 23, "天皇誕生日");

  add(
    3,
    vernalEquinox(year),
    "春分の日"
  );

  add(4, 29, "昭和の日");

  add(5, 3, "憲法記念日");

  add(5, 4, "みどりの日");

  add(5, 5, "こどもの日");

  const marine =
    nthMonday(year, 6, 3);

  holidays.push({
    date: formatDate(marine),
    name: "海の日"
  });

  add(8, 11, "山の日");

  const respect =
    nthMonday(year, 8, 3);

  holidays.push({
    date: formatDate(respect),
    name: "敬老の日"
  });

  add(
    9,
    autumnalEquinox(year),
    "秋分の日"
  );

  const sports =
    nthMonday(year, 9, 2);

  holidays.push({
    date: formatDate(sports),
    name: "スポーツの日"
  });

  add(11, 3, "文化の日");

  add(11, 23, "勤労感謝の日");

  return holidays;
}

function getAllHolidays(year) {

  let holidays =
    getHolidays(year);

  const holidayDates =
    new Set(
      holidays.map(h => h.date)
    );

  for (const h of [...holidays]) {

    const d =
      new Date(h.date);

    if (d.getDay() === 0) {

      let substitute =
        new Date(d);

      substitute.setDate(
        substitute.getDate() + 1
      );

      while (
        holidayDates.has(
          formatDate(substitute)
        )
      ) {

        substitute.setDate(
          substitute.getDate() + 1
        );
      }

      holidays.push({
        date: formatDate(substitute),
        name: "振替休日"
      });

      holidayDates.add(
        formatDate(substitute)
      );
    }
  }

  for (
    let month = 0;
    month < 12;
    month++
  ) {

    const lastDay =
      new Date(
        year,
        month + 1,
        0
      ).getDate();

    for (
      let day = 1;
      day <= lastDay;
      day++
    ) {

      const d =
        new Date(
          year,
          month,
          day
        );

      if (
        d.getDay() === 0 ||
        d.getDay() === 6
      ) {
        continue;
      }

      const yesterday =
        new Date(d);

      yesterday.setDate(
        yesterday.getDate() - 1
      );

      const tomorrow =
        new Date(d);

      tomorrow.setDate(
        tomorrow.getDate() + 1
      );

      if (
        holidayDates.has(
          formatDate(yesterday)
        ) &&
        holidayDates.has(
          formatDate(tomorrow)
        )
      ) {

        if (
          !holidayDates.has(
            formatDate(d)
          )
        ) {

          holidays.push({
            date: formatDate(d),
            name: "国民の休日"
          });

          holidayDates.add(
            formatDate(d)
          );
        }
      }
    }
  }

  return holidays;
}

function getHolidayInfo(d) {

  if (d.getDay() === 6) {
    return {
      holiday: true,
      name: "土曜日"
    };
  }

  if (d.getDay() === 0) {
    return {
      holiday: true,
      name: "日曜日"
    };
  }

  const holidays =
    getAllHolidays(
      d.getFullYear()
    );

  const holiday =
    holidays.find(
      h =>
        h.date === formatDate(d)
    );

  if (holiday) {

    return {
      holiday: true,
      name: holiday.name
    };
  }

  return {
    holiday: false,
    name: ""
  };
}

document.getElementById("date").textContent =
  `${year}年${month + 1}月${date}日 ${weekNames[weekday]}`;

document.getElementById("month").textContent =
  `今月：${month + 1}月`;

const lastDay =
  new Date(
    year,
    month + 1,
    0
  ).getDate();

const remaining =
  lastDay - date;

document.getElementById("remaining").textContent =
  `今月あと ${remaining}日`;

const todayInfoForLesson =
  getHolidayInfo(today);

if (
  (weekday === 1 || weekday === 5) &&
  !todayInfoForLesson.holiday
) {
  document.getElementById("lesson").textContent =
    "習い事：公文";
}

const todayInfo =
  getHolidayInfo(today);

if (todayInfo.holiday) {

  document.getElementById(
    "todayHoliday"
  ).textContent =
    `今日は「${todayInfo.name}」です`;
}

let days = 1;
let nextHoliday = null;

while (true) {

  const next =
    new Date(today);

  next.setDate(
    next.getDate() + days
  );

  const info =
    getHolidayInfo(next);

  if (info.holiday) {

    nextHoliday = {
      date: next,
      name: info.name
    };

    break;
  }

  days++;
}

document.getElementById(
  "nextHoliday"
).textContent =
  `次の休日まであと ${days}日`;

document.getElementById(
  "nextHolidayDate"
).textContent =
  `次の休日：${
    nextHoliday.date.getMonth() + 1
  }月${
    nextHoliday.date.getDate()
  }日（${
    weekNames[
      nextHoliday.date.getDay()
    ]
  }）`;

</script>
