<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ホームページ</title>
    <link rel="manifest" href="/ytaka5004911/manifest.json">
    <meta name="theme-color" content="#2196f3">
    <meta http-equiv="x-ua-compatible" content="IE=edge">
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/ytaka5004911/favicon.ico">
    <style>main{display:block;}a{display:inline-block;padding:12px 0;}p{margin:12px 0;}</style>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const r = navigator.serviceWorker.register('/ytaka5004911/sw.js');
          r.then(s => s.update())
           .catch(e => { if (window.console) console.error(e); });
        });
      }
    </script>
  </head>
  <body>
    <main>
      <div id="clock"></div>
      <form rel="noreferrer noopener" id="searchForm" role="search" action="https://www.google.com/search" method="get" target="_blank">
        <label for="search">Googleで検索する</label>
        <input aria-label="Googleで検索する内容" enterkeyhint="search" inputmode="search" id="search" autocapitalize="off" autocomplete="off" placeholder="Googleで検索します..." required type="text" name="q">
        <input type="hidden" name="ie" value="UTF-8">
        <input type="hidden" name="oe" value="UTF-8">
        <input type="hidden" name="hl" value="ja">
        <button aria-label="検索する" type="submit">Googleで検索</button>
        <button aria-label="AI検索する" type="submit" name="udm" value="50">AI検索</button>
        <button aria-label="URLに転送する" id="url_btn" type="button">URLに転送する</button>
        <button aria-label="サービス名で検索する" id="service_btn" type="button">サービス名で検索する</button>
      </form>
      <nav aria-label="リンク">
        <ul>
          <li><a target="_self" href="https://ytaka5004911.github.io/ytaka5004911/sym-checker/index.html">からだの相談チャット</a></li>
          <li><a target="_self" href="https://ytaka5004911.github.io/ytaka5004911/colorMix.html">色調合</a></li>
          <li><a target="_self" href="https://ytaka5004911.github.io/MedChartLite/index.html">MedChartLite</a></li>
        </ul>
      </nav>
    </main>
    <script>
      (() => {
        setInterval(()=>clock.textContent=new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}),1000)
        const s = document.getElementById('search');
        if (s) {
          window.onbeforeunload = (e) => {
            if (s.value.trim()) return ((e || window.event).returnValue = '');
          };
        }

        (() => {
          const f = document.getElementById('searchForm');
          if (!f) return;
          f.onsubmit = () => {
            setTimeout(() => f.reset(), 0);
          };
        })();

        const gourl = () => {
          let v = document.getElementById('search').value.replace(/\s+/g, '');
          if (v) {
            if (!v.includes('://')) v = `https://${v}`;
            if (v.includes('.')) {
              document.getElementById('search').value = '';
              location.href = v;
            }
          }
        };
        window.gourl = gourl;

        let sites = [];

        const noFile = () => {
          if (typeof console !== 'undefined' && typeof console.warn === 'function') {
            console.warn('[Warning] Some features are disabled in this environment.');
          }
          const e = document.getElementById('service_btn');
          if (e) {
            e.style.display = 'none';
            e.ariaHidden = 'true';
            e.hidden = true;
          }
        };

        const onData = (x) => { sites = x.sites; };

        if (typeof fetch === 'function') {
          fetch('/ytaka5004911/sites.json')
            .then(r => (r.ok ? r.json() : (noFile(), undefined)))
            .then(data => { if (data) onData(data); })
            .catch(() => noFile());
        } else if (typeof XMLHttpRequest === 'undefined') {
          noFile();
        } else {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', '/ytaka5004911/sites.json', true);
          xhr.onreadystatechange = () => {
            if (xhr.readyState === 4) {
              if (xhr.status === 200) {
                onData(JSON.parse(xhr.responseText));
              } else {
                noFile();
              }
            }
          };
          xhr.send();
        }

        const go = () => {
          if (!Array.prototype.filter || !Array.prototype.some) {
            noFile();
            return;
          }
          const q = document.getElementById('search').value.replace(/\s+/g, '').toLowerCase();
          const hit = sites.filter(s =>
            s.name.toLowerCase() === q ||
            (s.aliases || []).some(a => a.toLowerCase() === q)
          )[0];
          if (hit) {
            document.getElementById('search').value = '';
            location.href = hit.url;
          }
        };
        window.go = go;

        document.getElementById('url_btn')?.addEventListener('click', () => gourl());
        document.getElementById('service_btn')?.addEventListener('click', () => go());
      })();
    </script>
  </body>
</html>
