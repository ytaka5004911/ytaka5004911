<h2>最近見たリンク</h2>
<ul id="history"></ul>
 <p id="time"></p>

<script>
function updateTime() {
  const now = new Date();
  document.getElementById("time").textContent =
    now.toLocaleTimeString("ja-JP", {
  hour12: false
})
}

updateTime();
setInterval(updateTime, 1000);
</script><p id="usb"></p>
<p id="online"></p>

<script>
function update() {
  document.getElementById("usb").textContent =
    "USB: " + ("usb" in navigator ? "対応" : "非対応");

  document.getElementById("online").textContent =
    "オンライン: " + (navigator.onLine ? "はい" : "いいえ");
}

update();

window.addEventListener("online", update);
window.addEventListener("offline", update);
</script>
 <p id="connection"></p>

<script>
function updateConnection() {
  const c = navigator.connection;

  if (!c) {
    document.getElementById("connection").textContent =
      "Connection API: 非対応";
    return;
  }

  document.getElementById("connection").innerHTML =
    `回線: ${c.effectiveType}<br>` +
    `速度: ${c.downlink} Mbps<br>` +
    `遅延: ${c.rtt} ms<br>` +
    `データ節約: ${c.saveData ? "ON" : "OFF"}`;
}

updateConnection();

navigator.connection?.addEventListener("change", updateConnection);
</script>
 <h2>地震情報</h2>
<script>
 if ("Notification" in window && Notification.permission === "default") {

 const scale = {

  30: 3,
  40: 4,
  45: "5弱",
  50: "5強",
  55: "6弱",
  60: "6強",
  70: 7
};

let lastId = "";

function updateEarthquake() {
  fetch("https://api.p2pquake.net/v1/human-readable")
    .then(response => {
      if (!response.ok) {
        throw new Error("HTTP Error");
      }
      return response.json();
    })
    .then(data => {
      const e = data.find(item => item.code === 551);
      if (!e) return;

      // 同じ地震なら更新しない
      if (e.id === lastId) return;
      lastId = e.id;


if ("Notification" in window && Notification.permission === "granted") {
  new Notification("地震情報", {
    body: `${hypo.name}\n最大震度${intensity}\n${magnitude}`
  });
}

     
      let p = document.getElementById("earthquake");
      if (!p) {
        p = document.createElement("p");
        p.id = "earthquake";
        document.body.appendChild(p);
      }

      const intensity = scale[e.earthquake.maxScale] ?? "不明";

      const hypo = e.earthquake.hypocenter;

      const time = new Date(e.earthquake.time).toLocaleString("ja-JP");

      const magnitude =
        hypo.magnitude >= 0 ? `M${hypo.magnitude}` : "M不明";

      const depth =
        hypo.depth >= 0 ? `深さ${hypo.depth}km` : "深さ不明";

      p.textContent =
        `${time} / ${hypo.name} / ${depth} / 最大震度${intensity} / ${magnitude}`;
     const notification = new Notification("地震情報", {

});

notification.onclick = () => {

};
    })
 
   .catch(() => {
      let p = document.getElementById("earthquake");
      if (!p) {
        p = document.createElement("p");
        p.id = "earthquake";
        document.body.appendChild(p);
      }
      p.textContent = "地震情報を取得できませんでした。";
    });
}

// 起動時
updateEarthquake();

// 5分ごとに更新
setInterval(updateEarthquake, 5 * 60 * 1000);

// タブに戻ったら更新
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    updateEarthquake();
  }
});

// オンラインになったら更新
window.addEventListener("online", updateEarthquake);
 
</script>
