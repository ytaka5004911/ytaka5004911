<h2>地震情報</h2>
 <div id="q"></div>

<script>
const miiii = {
  10: 1,
  20: 2,
  30: 3,
  40: 4,
  45: "5弱",
  50: "5強",
  55: "6弱",
  60: "6強",
  70: 7
};

fetch("https://api.p2pquake.net/v1/human-readable?limit=20")
  .then(r => r.json())
  .then(d => {
    q.innerHTML = d
      .filter(x => x.code === 551 || x.code === 5610)
      .slice(0, 5)
      .map(x => {
        if (x.code === 551) {
          const e = x.earthquake;
          return `
            <b>🌍 地震情報</b><br>
            ${e.time}<br>
            ${e.hypocenter.name || "調査中"}<br>
            最大震度 ${miiii[e.maxScale] ?? "不明"}
            <hr>
          `;
        }

        return `
          <b>📳 地震感知情報</b><br>
          報告数: ${x.count}件<br>
          地域: ${Object.keys(x.areas).join("、")}
          <hr>
        `;
      })
      .join("");
  });
</script>
 <script>
  function updateTheme() {
  const hour = new Date().getHours();
  if (hour >= 17 || hour < 5) {
    document.body.classList.add("dark");
    document.body.classList.remove("light");
  } else {
    document.body.classList.add("light");
    document.body.classList.remove("dark");
  }
}
updateTheme();           // 最初に実行
